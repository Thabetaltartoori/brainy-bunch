# Netlify deploy for Brainy Bunch.
#
# The API is an Express app, so it is published as a Netlify Function that
# wraps the same app the local server runs. Both the function and the static
# build are served from the one *.netlify.app origin, which is what lets the
# session cookie stay SameSite=Strict with no CORS involved.
#
# The two Supabase values are NOT in this file. Set them with
#   npx netlify env:set  (or in the site's environment settings), never here.
# SUPABASE_SERVICE_ROLE_KEY bypasses row level security, so it must only ever
# live in the site's environment.

[build]
  command = "npm run build"
  publish = "client/dist"
  functions = "server/netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # api.mjs is ESM. The bundler picks the output format from the file
  # extension, and server/src/index.js uses a top-level `await` to open the
  # database connection, which esbuild refuses to emit in CJS. A plain .js
  # entry would make the build depend on the bundler guessing right.
  node_bundler = "esbuild"

[functions.environment]
  # Tells the app not to call app.listen(): inside a function there is no
  # port to bind and doing so would stop the instance ever responding.
  NETLIFY = "true"
  # The app only enables CORS when NODE_ENV is not production, and that CORS
  # setup reflects any requesting origin while allowing credentials. Same
  # origin here, so it is never needed, and the cookie is SameSite=Strict.
  NODE_ENV = "production"

# The API must be matched before the SPA catch-all below, otherwise /api/*
# would be answered with index.html.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Client-side routing: every other path is the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
